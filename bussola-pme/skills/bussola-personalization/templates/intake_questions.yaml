version: 1.0
questions:
  - id: company_name
    required: true
    prompt: "Qual é o nome da empresa do cliente?"
    type: text
    max_chars: 100
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: alto
      recommended_action: "Solicitar nome oficial da empresa ao cliente antes da primeira reunião"

  - id: segment
    required: true
    prompt: "Em qual segmento a empresa atua?"
    type: single_select
    options: [agência, serviços, produto, varejo, outro]
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: médio
      recommended_action: "Pesquisar LinkedIn/site da empresa para identificar segmento"

  - id: team_size
    required: true
    prompt: "Quantas pessoas trabalham na empresa? (número total, incluindo sócios)"
    type: integer
    min_value: 1
    max_value: 10000
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: médio
      recommended_action: "Perguntar ao cliente na primeira reunião de alinhamento"

  - id: annual_revenue_range
    required: true
    prompt: "Qual a faixa de faturamento anual da empresa?"
    type: single_select
    options:
      - "até R$ 100k"
      - "R$ 100k–R$ 500k"
      - "R$ 500k–R$ 1M"
      - "R$ 1M–R$ 5M"
      - "R$ 5M–R$ 20M"
      - "acima de R$ 20M"
      - "prefere não informar"
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: alto
      recommended_action: "Solicitar DRE simplificado ou estimativa do sócio-gestor"

  - id: primary_problem
    required: true
    prompt: "Descreva em até 200 caracteres o problema principal que motivou esta consultoria."
    type: text
    max_chars: 200
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: crítico
      recommended_action: "Realizar entrevista exploratória de 30min com o decisor principal antes de prosseguir"

  - id: secondary_problems
    required: false
    prompt: "Existem outros problemas relevantes? Liste um por linha (pode pular se não souber)."
    type: list
    max_items: 10
    prefill_source: [google_drive]
    not_know_action:
      impact: baixo
      recommended_action: "Identificar durante diagnóstico — registrar como gap de baixo impacto"

  - id: previous_diagnosis
    required: false
    prompt: "A empresa já fez algum diagnóstico consultivo anteriormente? (sim/não + detalhes se sim)"
    type: boolean_with_description
    prefill_source: [google_drive, gmail]
    not_know_action:
      impact: baixo
      recommended_action: "Perguntar ao cliente; histórico anterior pode revelar padrões"

  - id: urgency_level
    required: true
    prompt: "Qual o nível de urgência para resolução do problema principal?"
    type: single_select
    options:
      - low: "Pode aguardar 3+ meses"
      - medium: "Resolução em 1–3 meses"
      - high: "Urgente: 2–4 semanas"
      - critical: "Crise ativa: precisa agir agora"
    prefill_source: []
    not_know_action:
      impact: alto
      recommended_action: "Perguntar ao decisor: 'Se não resolver em X semanas, qual o impacto financeiro?'"

  - id: decision_makers
    required: true
    prompt: "Quem são os decisores chave neste caso? (nome + cargo, um por linha)"
    type: list
    max_items: 5
    prefill_source: [gmail]
    not_know_action:
      impact: alto
      recommended_action: "Mapear organograma mínimo na primeira reunião — sem decisores identificados, plano não pode ser executado"

  - id: available_documents
    required: false
    prompt: "Quais documentos estão disponíveis para análise? (ex: DRE, pipeline CRM, relatório de vendas)"
    type: list
    max_items: 20
    prefill_source: [google_drive]
    not_know_action:
      impact: médio
      recommended_action: "Solicitar lista de documentos disponíveis ao cliente; priorizar financeiros e operacionais"
